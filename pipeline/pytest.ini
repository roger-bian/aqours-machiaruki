[pytest]
testpaths = tests
# tests/ has no __init__.py, so pytest would otherwise put tests/ on sys.path
# rather than pipeline/, and `import app.hours` would fail. Run from pipeline/.
pythonpath = .

# geotable imports two shapely names that shapely 2.x deprecated, and osgeo
# warns that GDAL 4.0 will enable exceptions by default. Both are upstream and
# neither is actionable here; silencing them keeps a failure legible.
# Starlette's own notice about its TestClient's httpx dependency is the third;
# it fires on import, before any test runs.
filterwarnings =
    ignore:WKBReadingError is deprecated:FutureWarning
    ignore:WKTReadingError is deprecated:FutureWarning
    ignore:Neither osr.UseExceptions:FutureWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated
