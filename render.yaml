services:
  - type: web
    name: aqours-machiaruki-pipeline
    runtime: docker
    dockerfilePath: ./pipeline/Dockerfile
    dockerContext: ./pipeline
    buildFilter:
      paths:
        - pipeline/**
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PIPELINE_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false

  - type: web
    name: aqours-machiaruki-web
    runtime: static
    rootDir: ./web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: VITE_API_BASE
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
